<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="redBody" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="35%" stop-color="#ef4444" />
      <stop offset="80%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </radialGradient>
    <linearGradient id="specularRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="64" cy="64" r="54" fill="#ef4444" opacity="0.35" filter="url(#glowRed)" />

  <!-- Main Body -->
  <circle cx="64" cy="64" r="50" fill="url(#redBody)" stroke="#fecaca" stroke-width="3" />

  <!-- Soft Rim Light -->
  <path d="M 38 106 A 50 50 0 0 0 106 38 A 48 48 0 0 1 38 106 Z" fill="#f87171" opacity="0.3" />

  <!-- Top Glossy Reflection -->
  <ellipse cx="48" cy="36" rx="20" ry="11" transform="rotate(-30 48 36)" fill="url(#specularRed)" />
  <circle cx="74" cy="28" r="4.5" fill="#ffffff" opacity="0.75" />

  <!-- Energetic Eyes -->
  <ellipse cx="45" cy="63" rx="7.5" ry="10.5" fill="#450a0a" />
  <circle cx="43" cy="59" r="3.2" fill="#ffffff" />
  <circle cx="46.5" cy="66" r="1.5" fill="#ffffff" />

  <ellipse cx="79" cy="63" rx="7.5" ry="10.5" fill="#450a0a" />
  <circle cx="77" cy="59" r="3.2" fill="#ffffff" />
  <circle cx="80.5" cy="66" r="1.5" fill="#ffffff" />

  <!-- Cheeks -->
  <ellipse cx="33" cy="73" rx="6" ry="3.5" fill="#fb7185" opacity="0.5" />
  <ellipse cx="91" cy="73" rx="6" ry="3.5" fill="#fb7185" opacity="0.5" />

  <!-- Open Cute Mouth -->
  <path d="M 57 71 Q 62 79 67 71 Z" fill="#450a0a" />
  <path d="M 59 74 Q 62 77 65 74" fill="#f43f5e" />
</svg>
