<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="purpleBody" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f3e8ff" />
      <stop offset="35%" stop-color="#c084fc" />
      <stop offset="80%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#3b0764" />
    </radialGradient>
    <linearGradient id="specularPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Cute little antenna -->
  <path d="M 64 20 Q 64 10 56 6" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round" />
  <circle cx="54" cy="5" r="4.5" fill="#f43f5e" />

  <!-- Ambient Glow -->
  <circle cx="64" cy="66" r="52" fill="#c084fc" opacity="0.35" filter="url(#glowPurple)" />

  <!-- Main Body -->
  <circle cx="64" cy="66" r="48" fill="url(#purpleBody)" stroke="#f3e8ff" stroke-width="3" />

  <!-- Soft Rim Light -->
  <path d="M 38 106 A 48 48 0 0 0 106 38 A 46 46 0 0 1 38 106 Z" fill="#d8b4fe" opacity="0.3" />

  <!-- Top Glossy Reflection -->
  <ellipse cx="50" cy="40" rx="18" ry="10" transform="rotate(-30 50 40)" fill="url(#specularPurple)" />

  <!-- Goofy wide cute eyes looking around -->
  <circle cx="45" cy="66" r="9" fill="#2e1065" />
  <circle cx="43" cy="63" r="3.8" fill="#ffffff" />
  <circle cx="47" cy="69" r="1.5" fill="#ffffff" />

  <circle cx="79" cy="66" r="11" fill="#2e1065" />
  <circle cx="77" cy="63" r="4.8" fill="#ffffff" />
  <circle cx="82" cy="70" r="1.8" fill="#ffffff" />

  <!-- Cheeks -->
  <ellipse cx="33" cy="76" rx="5" ry="3" fill="#f43f5e" opacity="0.4" />
  <ellipse cx="91" cy="76" rx="5" ry="3" fill="#f43f5e" opacity="0.4" />

  <!-- Silly little 'O' mouth -->
  <ellipse cx="62" cy="76" rx="3.5" ry="4.5" fill="#2e1065" />
</svg>
