<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="greenBody" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#bbf7d0" />
      <stop offset="35%" stop-color="#22c55e" />
      <stop offset="80%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#052e16" />
    </radialGradient>
    <linearGradient id="specularGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="64" cy="64" r="54" fill="#22c55e" opacity="0.35" filter="url(#glowGreen)" />

  <!-- Main Body -->
  <circle cx="64" cy="64" r="50" fill="url(#greenBody)" stroke="#dcfce7" stroke-width="3" />

  <!-- Soft Rim Light -->
  <path d="M 38 106 A 50 50 0 0 0 106 38 A 48 48 0 0 1 38 106 Z" fill="#4ade80" opacity="0.3" />

  <!-- Top Glossy Reflection -->
  <ellipse cx="48" cy="36" rx="20" ry="11" transform="rotate(-30 48 36)" fill="url(#specularGreen)" />
  <circle cx="74" cy="28" r="4.5" fill="#ffffff" opacity="0.75" />

  <!-- Happy Curved Eyes (^.^) -->
  <path d="M 39 63 Q 46 54 53 63" fill="none" stroke="#052e16" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 73 63 Q 80 54 87 63" fill="none" stroke="#052e16" stroke-width="3.5" stroke-linecap="round" />

  <!-- Rosy Cheeks -->
  <ellipse cx="36" cy="71" rx="6" ry="3.5" fill="#f43f5e" opacity="0.45" />
  <ellipse cx="88" cy="71" rx="6" ry="3.5" fill="#f43f5e" opacity="0.45" />

  <!-- Cute Cat-like Smile -->
  <path d="M 58 70 Q 61 74 64 70 Q 67 74 70 70" fill="none" stroke="#052e16" stroke-width="2.5" stroke-linecap="round" />
</svg>
