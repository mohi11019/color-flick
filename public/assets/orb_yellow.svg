<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="yellowBody" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="80%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#713f12" />
    </radialGradient>
    <linearGradient id="specularYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glowYellow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="64" cy="64" r="54" fill="#facc15" opacity="0.38" filter="url(#glowYellow)" />

  <!-- Main Body -->
  <circle cx="64" cy="64" r="50" fill="url(#yellowBody)" stroke="#fef08a" stroke-width="3" />

  <!-- Soft Rim Light -->
  <path d="M 38 106 A 50 50 0 0 0 106 38 A 48 48 0 0 1 38 106 Z" fill="#fde047" opacity="0.3" />

  <!-- Top Glossy Reflection -->
  <ellipse cx="48" cy="36" rx="20" ry="11" transform="rotate(-30 48 36)" fill="url(#specularYellow)" />
  <circle cx="74" cy="28" r="4.5" fill="#ffffff" opacity="0.75" />

  <!-- Curious Bright Eyes (One winking or wide starry) -->
  <ellipse cx="46" cy="63" rx="7.5" ry="11" fill="#422006" />
  <circle cx="43.5" cy="58.5" r="3.5" fill="#ffffff" />
  <circle cx="47.5" cy="66" r="1.5" fill="#ffffff" />

  <!-- Cute Wink on Right Eye -->
  <path d="M 72 63 Q 79 56 86 63" fill="none" stroke="#422006" stroke-width="3.5" stroke-linecap="round" />

  <!-- Cheeks -->
  <ellipse cx="34" cy="73" rx="6" ry="3.5" fill="#f97316" opacity="0.45" />
  <ellipse cx="90" cy="73" rx="6" ry="3.5" fill="#f97316" opacity="0.45" />

  <!-- Playful Smile -->
  <path d="M 58 72 Q 62 77 66 72" fill="none" stroke="#422006" stroke-width="2.5" stroke-linecap="round" />
</svg>
