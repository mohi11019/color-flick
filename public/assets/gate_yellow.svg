<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="gateYellowCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="85%" stop-color="#a16207" />
      <stop offset="100%" stop-color="#422006" />
    </radialGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Ambient Outer Corona -->
  <circle cx="128" cy="128" r="115" fill="#eab308" opacity="0.18" />
  <circle cx="128" cy="128" r="98" fill="#eab308" opacity="0.25" />

  <!-- Cute Star / Lightning Crown Ears -->
  <polygon points="68,68 45,22 84,40" fill="url(#starGrad)" stroke="#fef08a" stroke-width="3" stroke-linejoin="round" />
  <polygon points="188,68 211,22 172,40" fill="url(#starGrad)" stroke="#fef08a" stroke-width="3" stroke-linejoin="round" />
  <!-- Center Star Crown Spike -->
  <polygon points="128,26 122,48 134,48" fill="#fef08a" stroke="#ca8a04" stroke-width="2" stroke-linejoin="round" />

  <!-- Outer Techno Ring with notches -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="#facc15" stroke-width="5" stroke-dasharray="16 10" />

  <!-- Main Solar Guardian Body -->
  <circle cx="128" cy="128" r="76" fill="url(#gateYellowCore)" stroke="#fef08a" stroke-width="4" />

  <!-- Playful Winking / Sparkling Eyes -->
  <!-- Left Eye: Big sparkle eye -->
  <ellipse cx="98" cy="100" rx="9" ry="12" fill="#422006" />
  <circle cx="95" cy="95" r="4" fill="#ffffff" />
  <circle cx="100" cy="103" r="1.8" fill="#ffffff" />

  <!-- Right Eye: Playful happy wink curve -->
  <path d="M 148 100 Q 158 90 168 100" fill="none" stroke="#422006" stroke-width="4" stroke-linecap="round" />
  <!-- Sparkle near right eye -->
  <path d="M 174 92 L 176 86 L 178 92 L 184 94 L 178 96 L 176 102 L 174 96 L 168 94 Z" fill="#ffffff" />

  <!-- Rosy Cheeks -->
  <ellipse cx="78" cy="112" rx="8" ry="4.5" fill="#f87171" opacity="0.55" />
  <ellipse cx="178" cy="112" rx="8" ry="4.5" fill="#f87171" opacity="0.55" />

  <!-- Open Joyful Star Mouth -->
  <path d="M 108 126 Q 128 152 148 126 Z" fill="#422006" stroke="#fef08a" stroke-width="2" />
  <path d="M 116 126 Q 128 142 140 126" fill="#eab308" opacity="0.85" />
  <!-- Cute little teeth -->
  <polygon points="116,126 120,132 124,126" fill="#ffffff" />
  <polygon points="132,126 136,132 140,126" fill="#ffffff" />
</svg>