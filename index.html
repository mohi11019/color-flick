<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Flick | نبرد رنگ‌ها</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
      }
      body {
        background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
        color: #fff;
        font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, Roboto, sans-serif;
      }
      #game-container {
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 50px rgba(6, 182, 212, 0.22);
        border: 2px solid rgba(56, 189, 248, 0.35);
        background: #020617;
      }
      canvas {
        display: block;
      }
      .instructions-bar {
        margin-top: 16px;
        font-size: 14px;
        color: #94a3b8;
        display: flex;
        gap: 16px;
        align-items: center;
        background: rgba(15, 23, 42, 0.75);
        padding: 8px 18px;
        border-radius: 30px;
        border: 1px solid rgba(56, 189, 248, 0.2);
        backdrop-filter: blur(10px);
      }
      .key-hint {
        background: rgba(255, 255, 255, 0.08);
        padding: 4px 12px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #f8fafc;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div class="instructions-bar">
      <span>🖱️ هدایت با موس</span>
      <span class="key-hint">🔥 سیستم کومبو</span>
      <span class="key-hint">❤️ ۵ جون</span>
      <span class="key-hint">🏆 بازی رکوردی</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
